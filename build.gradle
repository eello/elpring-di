plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.eello'
version = 'v1.4.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21 // 사용 중인 자바 버전
    targetCompatibility = JavaVersion.VERSION_21

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    /*
        컴파일 시점에 진짜 파라미터 이름을 바이트코드에 박아넣도록 설정
        빈 주입 시 빈 타입, @Primary로 주입할 빈을 결정하지 못했을 시 beanName으로 빈을 찾기 위함
            -> 파라미터 이름이 beanName이 되는데 이 옵션이 없으면 컴파일 시점에 빈 이름이 arg0 같은 형식으로 정상적으로 찾을 수 없음
     */
    options.compilerArgs << "-parameters"
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// JitPack이 결과물을 인식하게 하는 설정
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}